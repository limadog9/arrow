name: Assignment Event Smoke Test

on:
  pull_request_target:
    types: [opened, reopened, edited]
    branches: [test-34389-base]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assignment:
    if: github.repository == 'limadog9/arrow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: limadog9/arrow
          ref: 46154be2eac10f4a5aa923efdcaa6884b152a882
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.equal(context.eventName, 'pull_request_target');
            assert.match(context.payload.pull_request.title, /^GH-1:/);
            assert.equal(context.payload.pull_request.user.login, 'limadog9');
            const target = {...context.repo, issue_number: 1};
            const before = await github.rest.issues.get(target);
            assert.equal(before.data.assignees.length, 0);
            const previousComments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.payload.number
            });
            const previousIds = new Set(previousComments.map(c => c.id));
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/dev_pr/issue_check.js`);
            await script({github, context});
            const after = await github.rest.issues.get(target);
            assert(after.data.assignees.some(a => a.login === context.payload.pull_request.user.login));
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.payload.number
            });
            assert(comments.some(c => !previousIds.has(c.id) && c.user.login === 'github-actions[bot]' &&
              c.body.includes('GitHub issue #1 **has been automatically assigned in GitHub**')));
            await core.summary.addHeading('Real pull_request_target assignment test')
              .addRaw('PASS: unmodified event context and real GitHub API; GH-1 title parsed, target #1 assigned to PR creator, success comment posted by github-actions[bot].')
              .write();
